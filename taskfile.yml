version: '3'

vars:
  CORE: vendor/mgba_libretro.dylib
  GPSP_HOST: vendor/gpsp_libretro.dylib
  MGBA_COMMIT: e31759b24e7a4e3899285ff720d7b573ac328ae7
  GPSP_COMMIT: 7b2dd37394e2822110cacef321e9bb291a305b77
  CYGNE_COMMIT: 4b01295838ea89e3f1355bbe4cb5cf98aa6108cd
  LYNX_COMMIT: fcdefcfb3c11d6d2e71be076a5d3df2e88ab73ed
  # Gearsystem 3.9.22
  GEARSYSTEM_COMMIT: 517ddaaafbab1af7a312c2b6b6f6043275f58500
  SLOT_IN_PROCESS: >-
    --test bios --test core --test core_options --test e2e --test emu --test gb_palette_recolour --test gg_core --test gpsp
    --test link_ui --test mgba_gb_link --test mgba_link --test render_colour_correction
    --test render_gb_palette --test render_picture_modes --test runahead --test render
    --test render_in_game_menu --test render_power_wake --test render_quick_menu
    --test render_shelf --test render_shelves
  IN_PROCESS: >-
    (package(slot) & (binary(bios) | binary(core) | binary(core_options) | binary(e2e) | binary(emu)
    | binary(gb_palette_recolour) | binary(gg_core) | binary(gpsp) | binary(link_ui) | binary(mgba_gb_link)
    | binary(mgba_link) | binary(render_colour_correction) | binary(render_gb_palette)
    | binary(render_picture_modes) | binary(runahead) | binary(render) | binary(render_in_game_menu)
    | binary(render_power_wake) | binary(render_quick_menu) | binary(render_shelf)
    | binary(render_shelves)))
    | (package(slot-gfx) & binary(pipeline)) | (package(slot-ui) & binary(render_row_edges))
    | (package(slot-retro) & (binary(options) | binary(netpacket) | binary(libretro)))

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - task --list

  build:
    desc: Debug build of the whole workspace
    cmds:
      - cargo build --workspace

  release:
    desc: Release build of the slot binary
    cmds:
      - cargo build --release -p slot

  test:
    desc: Run the whole test suite in parallel with cargo-nextest, silent
    env:
      SLOT_SILENT: '1'
    cmds:
      - cargo nextest run --workspace --no-fail-fast -E 'not ({{.IN_PROCESS}})'
      - cargo test -p slot --no-fail-fast {{.SLOT_IN_PROCESS}}
      - cargo test -p slot-gfx --test pipeline
      - cargo test -p slot-ui --test render_row_edges
      - cargo test -p slot-retro --test options --test netpacket --test libretro

  test:one:
    desc: Run tests matching FILTER, eg task test:one FILTER=gesture
    requires:
      vars: [FILTER]
    env:
      SLOT_SILENT: '1'
    cmds:
      - cargo nextest run --workspace {{.FILTER}}

  fmt:
    desc: Format the workspace
    cmds:
      - cargo fmt --all

  fmt:check:
    desc: Fail if anything is unformatted
    cmds:
      - cargo fmt --all -- --check

  lint:
    desc: Clippy over all targets with warnings denied
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  lint:device:
    desc: Clippy the device build, which the host lint never compiles
    cmds:
      - cargo clippy -p slot --no-default-features --features device -- -D warnings

  check:
    desc: Everything a CI run would do
    cmds:
      - task: fmt:check
      - task: lint
      - task: lint:device
      - task: test
      - task: test:card

  test:card:
    desc: Test the scripts slot ships on the card, off-device
    cmds:
      - sh card/test-slotlink.sh
      - sh card/test-led.sh
      - sh card/test-coresave.sh
      - sh card/test-launch.sh

  core:
    desc: >-
      Build mGBA and fetch gpSP for this host. A missing core silently runs the mock (a test
      pattern and a sine tone) instead
    cmds:
      - task: core:mgba:host
      - task: core:gpsp:host

  core:mgba:host:
    desc: Build mgba_libretro for this host from the pinned libretro/mgba commit and cores/mgba's patches
    status:
      - test -f {{.CORE}}
      - test "$(cat {{.CORE}}.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target/mgba {{.CORE}}
      - file {{.CORE}} | grep -q Mach-O
      - 'echo "built {{.CORE}}"'

  core:gpsp:host:
    desc: Fetch the host gpSP core from the libretro buildbot
    status:
      - test -f {{.GPSP_HOST}}
    cmds:
      - |
        set -euo pipefail
        case "$(uname -m)" in
          arm64)  arch=arm64 ;;
          x86_64) arch=x86_64 ;;
          *) echo "unsupported arch $(uname -m)" >&2; exit 1 ;;
        esac
        mkdir -p vendor
        curl -fsSL -o vendor/gpsp-host.zip \
          "https://buildbot.libretro.com/nightly/apple/osx/${arch}/latest/gpsp_libretro.dylib.zip"
        unzip -o -q vendor/gpsp-host.zip -d vendor
        rm -f vendor/gpsp-host.zip
        file {{.GPSP_HOST}} | grep -q Mach-O
        echo "fetched {{.GPSP_HOST}}"

  core:update:
    desc: Rebuild mGBA and re-fetch gpSP for this host even if they are already vendored
    cmds:
      - rm -f {{.CORE}} {{.CORE}}.meta {{.GPSP_HOST}}
      - task: core

  icons:
    desc: Re-fetch the nerd font symbols used by the HUD
    vars:
      ASSETS: crates/slot-ui/assets
      TTF: SymbolsNerdFontMono-Regular.ttf
    cmds:
      - |
        set -euo pipefail
        tmp="$(mktemp -d)"
        trap 'rm -rf "$tmp"' EXIT
        curl -fsSL -o "$tmp/symbols.zip" \
          "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.zip"
        unzip -o -q "$tmp/symbols.zip" '{{.TTF}}' LICENSE -d "$tmp"
        mv "$tmp/{{.TTF}}" "{{.ASSETS}}/{{.TTF}}"
        mv "$tmp/LICENSE" "{{.ASSETS}}/{{.TTF}}.LICENSE.txt"
        echo "fetched {{.ASSETS}}/{{.TTF}}"

  sdcard:
    desc: Create an empty content root, ROOT defaults to ./sdcard
    deps: [build]
    vars:
      ROOT: '{{.ROOT | default "./sdcard"}}'
    cmds:
      - ./target/debug/slot --init-root {{.ROOT}}
      - 'echo "content root ready at {{.ROOT}}: roms in Games/GBA, Games/GB, Games/GBC, Games/WS, Games/Lynx or Games/GG, labels in the matching Labels/GBA, Labels/GB, Labels/GBC, Labels/WS, Labels/Lynx or Labels/GG, battery saves in the matching Saves/GBA, Saves/GB, Saves/GBC, Saves/WS, Saves/Lynx or Saves/GG, save states under the matching States/GBA, States/GB, States/GBC, States/WS, States/Lynx or States/GG, gba_bios.bin and lynxboot.img in BIOS, pngs in Wallpapers, palette in Config/theme.txt"'
      - 'echo "nothing is moved for you: a file loose at the top of Games/, Saves/, Labels/ or States/ is left where it is and never reaches the shelf"'

  run:
    desc: >-
      Run slot. against SLOT_ROOT, defaults to ./sdcard. SLOT_LINK_PORT moves the link
      session off 7211, which is what lets two copies on one machine link to each other -
      off-device both are on loopback, so the port is all that separates them
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run --release -p slot

  run:bare:
    desc: Run with no title bar or border, for screenshots and screen capture
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_BARE: '1'
    cmds:
      - cargo run --release -p slot

  run:4x3:
    desc: Run in a 4:3 window, as on the RG35XXSP, with the bezel around the screen
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
      SLOT_WINDOW: '1280x960'
    cmds:
      - cargo run --release -p slot

  run:debug:
    desc: Run an unoptimised build, for a debugger. Will not hold 60 fps.
    deps: [core]
    env:
      SLOT_ROOT: '{{.SLOT_ROOT | default "./sdcard"}}'
    cmds:
      - cargo run -p slot

  dist:
    desc: Build the copy-to-SD2 tree, OUT defaults to ./dist
    deps: [core, release]
    vars:
      OUT: '{{.OUT | default "dist"}}'
    cmds:
      - rm -rf {{.OUT}}
      - ./target/release/slot --init-root {{.OUT}}
      - cp target/release/slot {{.OUT}}/System/slot
      - cp {{.CORE}} {{.GPSP_HOST}} {{.OUT}}/System/
      - 'echo "dist ready at {{.OUT}}, copy its contents to SD2"'

  core:device:
    desc: Build the aarch64 linux mgba core for the device bundle, in the box the device build uses
    status:
      - test -f vendor/mgba_libretro.so
      - test "$(cat vendor/mgba_libretro.so.meta 2>/dev/null)" = "$(sh cores/mgba/build.sh stamp {{.MGBA_COMMIT}})"
    cmds:
      - task: device:sh
        vars:
          CMD: sh cores/mgba/build.sh build {{.MGBA_COMMIT}} target-device/mgba vendor/mgba_libretro.so
      - file vendor/mgba_libretro.so | grep -q aarch64
      - 'echo "built vendor/mgba_libretro.so"'

  core:gpsp:
    desc: >-
      Build the aarch64 linux gpSP core from its pinned source archive, which ships beside it
      as its GPL-2.0 section 3(a) corresponding source
    status:
      - test -f vendor/gpsp_libretro.so
      - test -f vendor/gpsp-src.tar.gz
      - test "$(cat vendor/gpsp-src.sha 2>/dev/null)" = "{{.GPSP_COMMIT}}"
      - test "$(cat vendor/gpsp_libretro.so.meta 2>/dev/null)" = "$(sh cores/gpsp/build.sh stamp {{.GPSP_COMMIT}})"
      - test "$(cat vendor/gpsp-src.meta 2>/dev/null)" = "$(sh cores/gpsp/build.sh stamp {{.GPSP_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/gpsp_libretro.so vendor/gpsp_libretro.so.meta \
              vendor/gpsp-src.tar.gz vendor/gpsp-src.sha vendor/gpsp-src.meta
        curl -fsSL -o vendor/gpsp-src.tar.gz \
          "https://github.com/libretro/gpsp/archive/{{.GPSP_COMMIT}}.tar.gz"
        tar -tzf vendor/gpsp-src.tar.gz | grep "^gpsp-{{.GPSP_COMMIT}}/Makefile$" > /dev/null
      - task: device:sh
        vars:
          CMD: >-
            sh cores/gpsp/build.sh build {{.GPSP_COMMIT}} vendor/gpsp-src.tar.gz
            target-device/gpsp vendor/gpsp_libretro.so
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - echo "{{.GPSP_COMMIT}}" > vendor/gpsp-src.sha
      - cp vendor/gpsp_libretro.so.meta vendor/gpsp-src.meta
      - 'echo "built vendor/gpsp_libretro.so from vendor/gpsp-src.tar.gz @ {{.GPSP_COMMIT}}"'

  core:gpsp:update:
    desc: Refetch gpSP's source archive and rebuild the core from it, even if the set is current
    cmds:
      - >-
        rm -f vendor/gpsp_libretro.so vendor/gpsp_libretro.so.meta vendor/gpsp-src.tar.gz
        vendor/gpsp-src.sha vendor/gpsp-src.meta
      - task: core:gpsp
  
  core:cygne:
    desc: >-
        Build the aarch64 linux Beetle WonderSwan (Cygne) core from its pinned source archive,
        which ships beside it as its GPL-2.0 corresponding source
    status:
      - test -f vendor/cygne_libretro.so
      - test -f vendor/cygne-src.tar.gz
      - test "$(cat vendor/cygne-src.sha 2>/dev/null)" = "{{.CYGNE_COMMIT}}"
      - test "$(cat vendor/cygne_libretro.so.meta 2>/dev/null)" = "$(sh cores/cygne/build.sh stamp {{.CYGNE_COMMIT}})"
      - test "$(cat vendor/cygne-src.meta 2>/dev/null)" = "$(sh cores/cygne/build.sh stamp {{.CYGNE_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/cygne_libretro.so vendor/cygne_libretro.so.meta \
              vendor/cygne-src.tar.gz vendor/cygne-src.sha vendor/cygne-src.meta
        curl -fsSL -o vendor/cygne-src.tar.gz \
          "https://github.com/libretro/beetle-wswan-libretro/archive/{{.CYGNE_COMMIT}}.tar.gz"
        tar -tzf vendor/cygne-src.tar.gz | grep "^beetle-wswan-libretro-{{.CYGNE_COMMIT}}/Makefile$" > /dev/null
      - task: device:sh
        vars:
          CMD: >-
            sh cores/cygne/build.sh build {{.CYGNE_COMMIT}} vendor/cygne-src.tar.gz
            target-device/cygne vendor/cygne_libretro.so
      - file vendor/cygne_libretro.so | grep -q aarch64
      - echo "{{.CYGNE_COMMIT}}" > vendor/cygne-src.sha
      - cp vendor/cygne_libretro.so.meta vendor/cygne-src.meta
      - 'echo "built vendor/cygne_libretro.so from vendor/cygne-src.tar.gz @ {{.CYGNE_COMMIT}}"'

  core:lynx:
    desc: >-
        Build the aarch64 linux Beetle Lynx core from its pinned source archive,
        which ships beside it as its GPL-2.0 corresponding source
    status:
      - test -f vendor/lynx_libretro.so
      - test -f vendor/lynx-src.tar.gz
      - test "$(cat vendor/lynx-src.sha 2>/dev/null)" = "{{.LYNX_COMMIT}}"
      - test "$(cat vendor/lynx_libretro.so.meta 2>/dev/null)" = "$(sh cores/lynx/build.sh stamp {{.LYNX_COMMIT}})"
      - test "$(cat vendor/lynx-src.meta 2>/dev/null)" = "$(sh cores/lynx/build.sh stamp {{.LYNX_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/lynx_libretro.so vendor/lynx_libretro.so.meta \
              vendor/lynx-src.tar.gz vendor/lynx-src.sha vendor/lynx-src.meta
        curl -fsSL -o vendor/lynx-src.tar.gz \
          "https://github.com/libretro/beetle-lynx-libretro/archive/{{.LYNX_COMMIT}}.tar.gz"
        tar -tzf vendor/lynx-src.tar.gz | grep "^beetle-lynx-libretro-{{.LYNX_COMMIT}}/Makefile$" > /dev/null
      - task: device:sh
        vars:
          CMD: >-
            sh cores/lynx/build.sh build {{.LYNX_COMMIT}} vendor/lynx-src.tar.gz
            target-device/lynx vendor/lynx_libretro.so
      - file vendor/lynx_libretro.so | grep -q aarch64
      - echo "{{.LYNX_COMMIT}}" > vendor/lynx-src.sha
      - cp vendor/lynx_libretro.so.meta vendor/lynx-src.meta
      - 'echo "built vendor/lynx_libretro.so from vendor/lynx-src.tar.gz @ {{.LYNX_COMMIT}}"'

  core:gearsystem:
    desc: >-
        Build the aarch64 linux Gearsystem (Game Gear) core from its pinned source archive,
        which ships beside it as its GPL-3.0 corresponding source
    status:
      - test -f vendor/gearsystem_libretro.so
      - test -f vendor/gearsystem-src.tar.gz
      - test "$(cat vendor/gearsystem-src.sha 2>/dev/null)" = "{{.GEARSYSTEM_COMMIT}}"
      - test "$(cat vendor/gearsystem_libretro.so.meta 2>/dev/null)" = "$(sh cores/gearsystem/build.sh stamp {{.GEARSYSTEM_COMMIT}})"
      - test "$(cat vendor/gearsystem-src.meta 2>/dev/null)" = "$(sh cores/gearsystem/build.sh stamp {{.GEARSYSTEM_COMMIT}})"
    cmds:
      - |
        set -euo pipefail
        mkdir -p vendor
        rm -f vendor/gearsystem_libretro.so vendor/gearsystem_libretro.so.meta \
              vendor/gearsystem-src.tar.gz vendor/gearsystem-src.sha vendor/gearsystem-src.meta
        curl -fsSL -o vendor/gearsystem-src.tar.gz \
          "https://github.com/drhelius/Gearsystem/archive/{{.GEARSYSTEM_COMMIT}}.tar.gz"
        tar -tzf vendor/gearsystem-src.tar.gz | grep "^Gearsystem-{{.GEARSYSTEM_COMMIT}}/platforms/libretro/Makefile$" > /dev/null
      - task: device:sh
        vars:
          CMD: >-
            sh cores/gearsystem/build.sh build {{.GEARSYSTEM_COMMIT}} vendor/gearsystem-src.tar.gz
            target-device/gearsystem vendor/gearsystem_libretro.so
      - file vendor/gearsystem_libretro.so | grep -q aarch64
      - echo "{{.GEARSYSTEM_COMMIT}}" > vendor/gearsystem-src.sha
      - cp vendor/gearsystem_libretro.so.meta vendor/gearsystem-src.meta
      - 'echo "built vendor/gearsystem_libretro.so from vendor/gearsystem-src.tar.gz @ {{.GEARSYSTEM_COMMIT}}"'

  core:gpsp:test:
    desc: Prove gpSP's Advance Wars session-flip patch still fixes what it was written for
    deps: [core:gpsp]
    cmds:
      - sh cores/gpsp/test/run.sh vendor/gpsp-src.tar.gz

  device:sh:
    desc: Run CMD on the box the device build wants, fetching one if this is not it
    internal: true
    requires:
      vars: [CMD]
    cmds:
      - |
        set -eu
        if [ "$(uname -s)-$(uname -m)" = "Linux-aarch64" ]; then
          sh -c '{{.CMD}}'
        else
          docker run --rm --platform linux/arm64 -v "$PWD":/src -w /src rust:1-bullseye sh -c '{{.CMD}}'
        fi

  build:device:
    desc: Build for the H700, in an arm64 container unless this is already one
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile device --target-dir target-device
            -p slot --no-default-features --features device
      - file target-device/device/slot | grep -q aarch64
      - 'echo "built target-device/device/slot"'

  bench:device:
    desc: Build core_bench, slot-retro's headless core benchmark, for the H700. It never ships
    cmds:
      - task: device:sh
        vars:
          CMD: >-
            cargo build --profile device --target-dir target-device
            -p slot-retro --example core_bench
      - file target-device/device/examples/core_bench | grep -q aarch64
      - 'echo "built target-device/device/examples/core_bench, adb push it to /tmp/core_bench"'

  dist:device:
    desc: Build the SD2 tree for an H700 device, OUT defaults to ./dist-device
    deps: [core:device, core:gpsp, core:cygne, core:lynx, core:gearsystem, build:device]
    vars:
      OUT: '{{.OUT | default "dist-device"}}'
    cmds:
      - rm -rf {{.OUT}}
      - task: device:sh
        vars:
          CMD: ./target-device/device/slot --init-root {{.OUT}}
      - cp target-device/device/slot {{.OUT}}/System/slot
      - cp -R card/System/* {{.OUT}}/System/
      - file vendor/mgba_libretro.so | grep -q aarch64
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - file vendor/cygne_libretro.so | grep -q aarch64
      - file vendor/lynx_libretro.so | grep -q aarch64
      - file vendor/gearsystem_libretro.so | grep -q aarch64
      - cp vendor/mgba_libretro.so {{.OUT}}/System/
      - cp vendor/gpsp_libretro.so {{.OUT}}/System/
      - cp vendor/cygne_libretro.so {{.OUT}}/System/
      - cp vendor/lynx_libretro.so {{.OUT}}/System/
      - cp vendor/gearsystem_libretro.so {{.OUT}}/System/
      - cp -r licenses {{.OUT}}/System/licenses
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        cp vendor/gpsp-src.tar.gz "{{.OUT}}/System/licenses/gpsp-${sha}.tar.gz"
        cp vendor/gpsp-src.meta "{{.OUT}}/System/licenses/gpsp-${sha}.meta"
        for p in cores/gpsp/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/gpsp-$(basename "$p")"
        done
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        cp vendor/mgba_libretro.so.meta "{{.OUT}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          cp "$p" "{{.OUT}}/System/licenses/mgba-$(basename "$p")"
        done
      - 'echo "device tree ready at {{.OUT}}, copy its contents to SD2"'
      - |
        set -euo pipefail
        sha="$(cat vendor/cygne-src.sha)"
        cp vendor/cygne-src.tar.gz "{{.OUT}}/System/licenses/cygne-${sha}.tar.gz"
        cp vendor/cygne-src.meta "{{.OUT}}/System/licenses/cygne-${sha}.meta"
      - |
        set -euo pipefail
        sha="$(cat vendor/lynx-src.sha)"
        cp vendor/lynx-src.tar.gz "{{.OUT}}/System/licenses/lynx-${sha}.tar.gz"
        cp vendor/lynx-src.meta "{{.OUT}}/System/licenses/lynx-${sha}.meta"
      - |
        set -euo pipefail
        sha="$(cat vendor/gearsystem-src.sha)"
        cp vendor/gearsystem-src.tar.gz "{{.OUT}}/System/licenses/gearsystem-${sha}.tar.gz"
        cp vendor/gearsystem-src.meta "{{.OUT}}/System/licenses/gearsystem-${sha}.meta"
      - 'echo "device tree ready at {{.OUT}}, copy its contents to SD2"'

  deploy:device:
    desc: Build and push onto a device over adb, then restart it. SD defaults to /mnt/sdcard
    deps: [core:device, core:gpsp, core:cygne, core:lynx, core:gearsystem, build:device]
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb wait-for-device
      - file vendor/mgba_libretro.so | grep -q aarch64
      - file vendor/gpsp_libretro.so | grep -q aarch64
      - file vendor/cygne_libretro.so | grep -q aarch64
      - file vendor/lynx_libretro.so | grep -q aarch64
      - file vendor/gearsystem_libretro.so | grep -q aarch64
      - adb push target-device/device/slot '{{.SD}}/System/slot'
      - for f in card/System/*; do adb push "$f" '{{.SD}}/System/'; done
      - adb push vendor/mgba_libretro.so '{{.SD}}/System/mgba_libretro.so'
      - adb push vendor/gpsp_libretro.so '{{.SD}}/System/gpsp_libretro.so'
      - adb push vendor/cygne_libretro.so '{{.SD}}/System/cygne_libretro.so'
      - adb push vendor/lynx_libretro.so '{{.SD}}/System/lynx_libretro.so'
      - adb push vendor/gearsystem_libretro.so '{{.SD}}/System/gearsystem_libretro.so'
      - adb push licenses '{{.SD}}/System/'
      - |
        set -euo pipefail
        sha="$(cat vendor/gpsp-src.sha)"
        adb push vendor/gpsp-src.tar.gz "{{.SD}}/System/licenses/gpsp-${sha}.tar.gz"
        adb push vendor/gpsp-src.meta "{{.SD}}/System/licenses/gpsp-${sha}.meta"
        for p in cores/gpsp/*.patch; do
          adb push "$p" "{{.SD}}/System/licenses/gpsp-$(basename "$p")"
        done
      - |
        set -euo pipefail
        commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
        adb push vendor/mgba_libretro.so.meta "{{.SD}}/System/licenses/mgba-${commit}.meta"
        for p in cores/mgba/*.patch; do
          adb push "$p" "{{.SD}}/System/licenses/mgba-$(basename "$p")"
        done
      - |
        set -euo pipefail
        sha="$(cat vendor/cygne-src.sha)"
        adb push vendor/cygne-src.tar.gz "{{.SD}}/System/licenses/cygne-${sha}.tar.gz"
        adb push vendor/cygne-src.meta "{{.SD}}/System/licenses/cygne-${sha}.meta"
      - |
        set -euo pipefail
        sha="$(cat vendor/lynx-src.sha)"
        adb push vendor/lynx-src.tar.gz "{{.SD}}/System/licenses/lynx-${sha}.tar.gz"
        adb push vendor/lynx-src.meta "{{.SD}}/System/licenses/lynx-${sha}.meta"
      - |
        set -euo pipefail
        sha="$(cat vendor/gearsystem-src.sha)"
        adb push vendor/gearsystem-src.tar.gz "{{.SD}}/System/licenses/gearsystem-${sha}.tar.gz"
        adb push vendor/gearsystem-src.meta "{{.SD}}/System/licenses/gearsystem-${sha}.meta"
      - adb shell 'chmod +x {{.SD}}/System/slot && sync'
      - adb reboot
      - adb wait-for-device
      - 'echo "deployed to {{.SD}}, device rebooting"'

  log:device:
    desc: Read slot's log back off a connected device
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb shell 'cat {{.SD}}/Logs/slot.log'

  clean:
    desc: Remove build output and dist
    cmds:
      - cargo clean
      - rm -rf dist dist-device target-device
