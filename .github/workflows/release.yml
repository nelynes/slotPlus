name: release

# A tag on main releases two card trees built from the tagged commit:
# slotPlus Ultra, and slotPlus Core (the same code with the core feature).
#
# The same zip is published a second time as slot-plus.zip: a 3.0 slotPlus card
# looks for that name in versions.json, so it updates into Ultra.
#
# Run by hand from any branch to try that branch on a card.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree (${{ matrix.edition }})
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    strategy:
      fail-fast: true
      matrix:
        include:
          - edition: ultra
            suffix: '-ultra'
            zip: slot-plusultra.zip
          - edition: core
            suffix: '-core'
            zip: slot-core.zip
    steps:
      - uses: actions/checkout@v7

      - name: Install zip, cmake, Task and Bun
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip unzip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin
          curl -fsSL https://bun.sh/install | BUN_INSTALL=/usr/local bash -s "bun-v1.2.6"

      - name: Build the tree
        # The version slot reports, and compares with versions.json to offer an update.
        env:
          SLOT_VERSION: ${{ github.ref_name }}
        run: task dist:device OUT="slot-${GITHUB_REF_NAME}${{ matrix.suffix }}" EDITION=${{ matrix.edition }}

      - name: Check what is about to ship
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}${{ matrix.suffix }}"
          test -x "$out/System/slot"
          file "$out/System/slot" | grep -q aarch64
          test -f "$out/System/gambatte_libretro.so"
          # Every core in the tree is built for the device...
          for so in "$out"/System/*_libretro.so; do
            file "$so" | grep -q aarch64
          done
          # ...and every core built from a pinned source ships that source.
          for sha_file in vendor/*-src.sha; do
            name="$(basename "$sha_file" -src.sha)"
            sha="$(cat "$sha_file")"
            test -f "$out/System/licenses/${name}-${sha}.tar.gz"
            test -f "$out/System/licenses/${name}-${sha}.meta"
          done
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}${{ matrix.suffix }}"
          zip -qry "${{ matrix.zip }}" "$out"
          git config --global --add safe.directory "$PWD"
          git rev-parse --short HEAD > "${{ matrix.edition }}-commit.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: card-${{ matrix.edition }}
          path: |
            ${{ matrix.zip }}
            ${{ matrix.edition }}-commit.txt
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    # Pinned: on the Ubuntu 26 image ubuntu-latest moved to in October 2026,
    # the notes for v1.10.0-plus2.3 came out empty.
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        with:
          pattern: card-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          for f in CHANGELOG.md slot-plusultra.zip slot-core.zip; do
            test -s "$f" || { echo "::error::$f is missing or empty"; exit 1; }
          done
          # 3.0 slotPlus cards update to whatever is published as slot-plus.zip.
          cp slot-plusultra.zip slot-plus.zip
          # The release's own notes are its entry in the changelog, from its
          # heading to the next one, followed by how to install.
          python3 - "${tag#v}" <<'PY'
          import sys
          head = "## [" + sys.argv[1] + "]"
          lines = open("CHANGELOG.md", encoding="utf-8").read().splitlines()
          start = next((i for i, l in enumerate(lines) if l.startswith(head)), None)
          if start is None:
              print(f"::error::CHANGELOG.md has no entry headed {head}")
              sys.exit(1)
          body = []
          for l in lines[start + 1:]:
              if l.startswith("## "):
                  break
              body.append(l)
          notes = "\n".join(body).strip()
          if not notes:
              print(f"::error::the CHANGELOG.md entry {head} is empty")
              sys.exit(1)
          open("notes.md", "w", encoding="utf-8").write(notes + "\n")
          print(f"notes: {len(notes.splitlines())} lines from {head}")
          PY
          cat >> notes.md <<NOTES

          **Fresh install:** download \`slot-plusultra.zip\` (slotPlus Ultra, every option) or \`slot-core.zip\` (slotPlus Core, set up for you), unzip, and move all contents into the Slot card.
          **Upgrade install:** download the same edition, unzip, and replace the 'System' folder in your card with the new one from the release, or use Settings → Online → Check for Updates.

          \`slot-plus.zip\` is the same download under its old name, so cards on slotPlus 3.0 update straight into slotPlus Ultra over Wi-Fi.

          All emulator licences, patches and source are in \`System/licenses/\` in each download.

          Atari Lynx games need \`lynxboot.img\`, which is not included. Put your own copy in \`BIOS/\`.
          NOTES
          gh release create "$tag" slot-plus.zip slot-plusultra.zip slot-core.zip --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --notes-file notes.md

      # Republish the site so versions.json offers this release to cards over Wi-Fi.
      - name: Publish versions.json with the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
