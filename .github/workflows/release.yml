name: release

# A tag on main releases two card trees: slotPlus, built from the tagged
# commit, and slotPlusUltra, built from the head of the slotPlusUltra branch
# as it is when the tag is pushed. Bring main's changes into slotPlusUltra
# before tagging, so the Ultra download has them too.
#
# Run by hand from another branch to try it on a card, it builds Ultra from
# the branch named in ultra_ref: the Ultra side of the branch being tried,
# not slotPlusUltra, or the Ultra download would not have the change.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ultra_ref:
        description: Branch to build slotPlusUltra from
        default: slotPlusUltra

permissions:
  contents: read

jobs:
  build:
    name: card tree (${{ matrix.edition }})
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    strategy:
      fail-fast: true
      matrix:
        include:
          - edition: plus
            ref: ''
            suffix: ''
            zip: slot-plus.zip
          - edition: ultra
            ref: ${{ inputs.ultra_ref || 'slotPlusUltra' }}
            suffix: '-ultra'
            zip: slot-plusultra.zip
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Install zip, cmake and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Build the tree
        run: task dist:device OUT="slot-${GITHUB_REF_NAME}${{ matrix.suffix }}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}${{ matrix.suffix }}"
          test -x "$out/System/slot"
          file "$out/System/slot" | grep -q aarch64
          # Every core in the tree is built for the device...
          for so in "$out"/System/*_libretro.so; do
            file "$so" | grep -q aarch64
          done
          # ...and every core built from a pinned source ships that source.
          for sha_file in vendor/*-src.sha; do
            name="$(basename "$sha_file" -src.sha)"
            sha="$(cat "$sha_file")"
            test -f "$out/System/licenses/${name}-${sha}.tar.gz"
            test -f "$out/System/licenses/${name}-${sha}.meta"
          done
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}${{ matrix.suffix }}"
          zip -qry "${{ matrix.zip }}" "$out"
          git config --global --add safe.directory "$PWD"
          git rev-parse --short HEAD > "${{ matrix.edition }}-commit.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: card-${{ matrix.edition }}
          path: |
            ${{ matrix.zip }}
            ${{ matrix.edition }}-commit.txt
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: card-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          ultra_commit="$(cat ultra-commit.txt)"
          cat > notes.md <<NOTES
          **Release Highlights:** XYZ
         
          SlotPlus comes in two flavors.
          - **\`slot-plus.zip\`, slotPlus:** Game Boy Advance, Game Boy and Game Boy Color, plus WonderSwan and Atari Lynx.
          - **\`slot-plusultra.zip\`, slotPlusUltra:** everything in slotPlus, plus Game Gear, NeoGeo Pocket and TurboGrafx-16.

          **Fresh install:** pick the version you prefer, unzip, and move all contents into the Slot card.
          **Upgrade install:** pick the version you prefer, unzip, and replace the 'System' folder in your card with the new one from the release.

          All emulator licences, patches and source are in \`System/licenses/\` in each download.

          Atari Lynx games need \`lynxboot.img\`, which is not included. Put your own copy in \`BIOS/\`.
          NOTES
          gh release create "$tag" slot-plus.zip slot-plusultra.zip --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --notes-file notes.md
