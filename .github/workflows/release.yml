name: release

# A tag on main releases two card trees: slotPlus, built from the tagged
# commit, and slotPlusUltra, built from the head of the slotPlusUltra branch
# as it is when the tag is pushed. Bring main's changes into slotPlusUltra
# before tagging, so the Ultra download has them too.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: card tree (${{ matrix.edition }})
    runs-on: ubuntu-24.04-arm
    container: rust:1-bullseye
    strategy:
      fail-fast: true
      matrix:
        include:
          - edition: plus
            ref: ''
            suffix: ''
          - edition: ultra
            ref: slotPlusUltra
            suffix: '-ultra'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}

      - name: Install zip, cmake and Task
        run: |
          set -eu
          sed -i '/bullseye-security/d' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends zip cmake
          curl -fsSL https://taskfile.dev/install.sh | sh -s -- -b /usr/local/bin

      - name: Build the tree
        run: task dist:device OUT="slot-${GITHUB_REF_NAME}${{ matrix.suffix }}"

      - name: Check what is about to ship
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}${{ matrix.suffix }}"
          test -x "$out/System/slot"
          file "$out/System/slot" | grep -q aarch64
          # Every core in the tree is built for the device...
          for so in "$out"/System/*_libretro.so; do
            file "$so" | grep -q aarch64
          done
          # ...and every core built from a pinned source ships that source.
          for sha_file in vendor/*-src.sha; do
            name="$(basename "$sha_file" -src.sha)"
            sha="$(cat "$sha_file")"
            test -f "$out/System/licenses/${name}-${sha}.tar.gz"
            test -f "$out/System/licenses/${name}-${sha}.meta"
          done
          for p in cores/gpsp/*.patch; do
            test -f "$out/System/licenses/gpsp-$(basename "$p")"
          done
          mgba_src_commit="$(grep '^commit=' vendor/mgba_libretro.so.meta | cut -d= -f2)"
          test -f "$out/System/licenses/mgba-${mgba_src_commit}.meta"
          for p in cores/mgba/*.patch; do
            test -f "$out/System/licenses/mgba-$(basename "$p")"
          done

      - name: Package
        run: |
          set -eu
          out="slot-${GITHUB_REF_NAME}${{ matrix.suffix }}"
          zip -qry "$out-h700.zip" "$out"
          git config --global --add safe.directory "$PWD"
          git rev-parse --short HEAD > "${{ matrix.edition }}-commit.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: card-${{ matrix.edition }}
          path: |
            slot-*-h700.zip
            ${{ matrix.edition }}-commit.txt
          if-no-files-found: error

  publish:
    name: release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: card-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="$GITHUB_REF_NAME"
          ultra_commit="$(cat ultra-commit.txt)"
          cat > notes.md <<NOTES
          Two downloads. Pick one, unzip it and copy the contents of its folder onto SD2.

          - **\`slot-${tag}-h700.zip\`, slotPlus:** Game Boy Advance, Game Boy and Game Boy Color, plus WonderSwan and Atari Lynx.
          - **\`slot-${tag}-ultra-h700.zip\`, slotPlusUltra:** everything in slotPlus, plus Game Gear, NeoGeo Pocket and TurboGrafx-16. Built from the slotPlusUltra branch at ${ultra_commit}.

          Emulation by mGBA (MPL-2.0), gpSP (GPL-2.0), Beetle WonderSwan / Cygne (GPL-2.0) and Beetle Lynx (GPL-2.0), and in slotPlusUltra also Gearsystem (GPL-3.0), Beetle NeoPop (GPL-2.0) and Beetle PCE Fast (GPL-2.0). Their licences, patches and source are in \`System/licenses/\` in each download.

          Atari Lynx games need \`lynxboot.img\`, which is not included. Put your own copy in \`BIOS/\`.
          NOTES
          gh release create "$tag" slot-*-h700.zip --repo "$GITHUB_REPOSITORY" \
            --title "$tag" --notes-file notes.md
